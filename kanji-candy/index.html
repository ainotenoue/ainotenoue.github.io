<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KANJI CANDY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#F1ACF2; --lav:#EFD5F2; --purple:#977EF2; --blue:#7EB0F2; --yellow:#F2EDA0;
    --ink:#3f3266; --sub:#8a7fb0; --deep:#6a52d9; --hot:#d966da;
    --paper:#ffffff; --box:200px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body,button,a{touch-action:manipulation}  /* ダブルタップでの拡大を止める */
  html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;
    font-family:"Zen Maru Gothic",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  /* 背景：ラベンダーのグラデーション＋水玉 */
  body{background:
      radial-gradient(circle at 12% 18%,rgba(241,172,242,.45) 0 3px,transparent 4px) 0 0/90px 90px,
      radial-gradient(circle at 60% 70%,rgba(255,255,255,.7) 0 2.5px,transparent 3.5px) 0 0/90px 90px,
      radial-gradient(circle at 85% 30%,rgba(242,237,160,.9) 0 3px,transparent 4px) 0 0/130px 130px,
      linear-gradient(160deg,#e9f5e4 0%,#d9eedb 50%,#d3ebe2 100%)}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:10px 16px 12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
  h1{margin:0;line-height:0}
  .logo-s svg{height:38px;width:auto;display:block}
  .logo-l{max-width:620px;margin:0 auto 6px}
  .logo-l svg{width:100%;height:auto;display:block}
  .meta{font-size:14px;color:var(--sub);display:flex;gap:10px;align-items:center}
  .pill{background:rgba(255,255,255,.75);border:2px solid #fff;border-radius:999px;padding:3px 12px;font-weight:700;box-shadow:0 2px 6px rgba(151,126,242,.15)}
  .home{color:var(--deep);text-decoration:none}
  .pen-on{color:var(--deep);background:#fff}
  #score{background:var(--yellow);color:#8a6d00;border-color:#fff}
  .progress{height:10px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;margin:8px 0;flex:none;box-shadow:inset 0 1px 2px rgba(151,126,242,.2)}
  .progress i{display:block;height:100%;width:0;transition:width .4s;border-radius:99px;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue))}

  .screen{display:none;flex:1;min-height:0}
  .screen.active{display:flex;flex-direction:column}
  .card{background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:28px;padding:14px 18px;
    box-shadow:0 10px 30px rgba(151,126,242,.18),0 0 0 1px rgba(151,126,242,.08)}

  /* 問題画面 */
  #play .card{flex:1;min-height:0;display:flex;flex-direction:column}
  .qhead{flex:none;text-align:center}
  .qno{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--purple);border-radius:99px;padding:2px 12px}
  .q{font-family:"Klee One",serif;font-size:28px;line-height:1.5;margin:4px 0 8px;color:var(--ink)}
  .q .kata{color:var(--hot);font-weight:600;padding:0 4px;border-radius:6px;
    background:linear-gradient(transparent 62%,var(--yellow) 62%)}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;gap:28px}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .collabel{font-size:14px;font-weight:700;color:var(--sub);height:20px}
  .colboxes{display:grid;grid-template-rows:repeat(var(--n,1),var(--box));grid-auto-columns:var(--box);grid-auto-flow:column;direction:rtl;gap:8px}
  .divider{align-self:stretch;width:0;border-left:3px dotted var(--pink);margin-top:26px}

  .cell,.anscell{position:relative;width:var(--box);height:var(--box);border-radius:18px;background:#fff;
    background-image:
      repeating-linear-gradient(to bottom,#f3c6f4 0 6px,transparent 6px 12px),
      repeating-linear-gradient(to right,#f3c6f4 0 6px,transparent 6px 12px);
    background-size:2px 100%,100% 2px;background-position:center,center;background-repeat:no-repeat}
  .cell{border:3px solid var(--purple);box-shadow:0 4px 0 #d9cffb}
  .cell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:15px}
  .anscell{border:3px solid var(--lav);display:flex;align-items:center;justify-content:center;
    font-family:"Klee One",serif;font-size:calc(var(--box)*.8);line-height:1;color:transparent;transition:color .25s,border-color .25s}
  .anscell::after{content:"？";position:absolute;font-family:"Zen Maru Gothic";font-weight:700;font-size:calc(var(--box)*.3);color:var(--lav)}
  .show .anscell{color:var(--ink);border-color:var(--pink);box-shadow:0 4px 0 #f6d3f7}
  .show .anscell::after{content:none}
  .ghost{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;
    font-family:"Klee One",serif;font-size:calc(var(--box)*.8);line-height:1;color:rgba(217,102,218,.32)}
  .overlay .ghost{display:flex}

  /* ボタン：ぷっくりした丸いキャンディ型 */
  button{font-family:inherit;font-weight:700;font-size:17px;border-radius:22px;border:none;cursor:pointer;
    background:#fff;color:var(--deep);padding:10px 18px;min-width:100px;
    box-shadow:0 5px 0 #d9cffb,inset 0 0 0 3px var(--lav);transition:transform .08s,box-shadow .08s}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #d9cffb,inset 0 0 0 3px var(--lav)}
  button.primary{color:#fff;background:linear-gradient(180deg,#a993f6,var(--purple));
    box-shadow:0 5px 0 #6f58cf,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(80,50,180,.35)}
  button.primary:active{box-shadow:0 1px 0 #6f58cf}
  button.ok{color:#fff;background:linear-gradient(180deg,#f6c3f7,var(--pink) 45%,#e48fe6);
    box-shadow:0 5px 0 #c66ec8,inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 1px 3px rgba(160,50,170,.45)}
  button.ok:active{box-shadow:0 1px 0 #c66ec8}
  button.ng{color:#fff;background:linear-gradient(180deg,#a3c8f7,var(--blue));
    box-shadow:0 5px 0 #5b8fd6,inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 1px 2px rgba(40,80,160,.4)}
  button.ng:active{box-shadow:0 1px 0 #5b8fd6}
  .ghostbtn{background:var(--yellow);color:#7a6400;box-shadow:0 5px 0 #d8d070}
  .ghostbtn:active{box-shadow:0 1px 0 #d8d070}
  .ghostbtn.on{background:#fff7a8;color:#7a6400;box-shadow:0 5px 0 #d8d070,inset 0 0 0 3px #e3d85a}

  .bar{flex:none;display:flex;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  /* 中心線の上にメイン、下に消す系／書き直す、いちばん下に「重ねる」 */
  .side{display:none;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:18px;width:180px;
    margin-top:26px;height:calc(var(--n)*var(--box) + (var(--n) - 1)*8px)}
  .side .up,.side .down{min-height:0}
  .side button{min-width:0;padding:8px 6px;font-size:17px;line-height:1.3}
  .side .up{display:flex;align-items:flex-end}
  .side .main{height:110px;width:100%;font-size:23px;border-radius:30px}
  .side .pair{gap:10px}
  .side .pair .main{flex:1;font-size:21px;line-height:1.25;border-radius:26px}
  .side .down{display:flex;flex-direction:column;justify-content:space-between;gap:12px;overflow:visible}
  .side .down>*{flex:none}
  .side .low{display:flex;gap:10px}
  .side .low button{flex:1;height:76px}
  .side .ghostbtn{height:60px;width:100%;border-radius:99px}
  .side button.ng{font-size:20px}
  #qcard.st-write .side.write,#qcard.st-judge .side.judge,#qcard.st-rewrite .side.rewrite{display:grid}
  .msg{height:22px;font-size:15px;font-weight:700;color:var(--hot);text-align:center;margin-top:8px;flex:none}

  /* スタート・結果 */
  .center{text-align:center}
  .scroll{overflow:auto}
  #start .card,#result .card{margin:auto 0;padding:34px 24px}
  .hero{font-size:46px;letter-spacing:.3em;margin:0 0 4px}
  .hero span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .hero span:nth-child(2){animation-delay:.3s}.hero span:nth-child(3){animation-delay:.6s}
  @keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
  .big{font-size:60px;font-weight:700;margin:8px 0;
    background:linear-gradient(90deg,var(--hot),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:16px 0;text-align:left}
  .list div{background:#fff;border:3px solid var(--lav);border-radius:18px;padding:8px 14px;font-family:"Klee One",serif;font-size:17px}
  .list b{color:var(--hot);font-size:24px;margin-left:6px}
  .choice{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0 22px}
  .choice button{border-radius:99px;min-width:96px}
  .choice button.sel{color:#fff;background:var(--blue);box-shadow:0 5px 0 #5b8fd6}
  #startBtn{font-size:24px;padding:16px 56px;border-radius:99px}

  /* ホーム（お店・瓶・チョコ・ペン） */
  #start .card{margin:0;padding:18px 22px}
  .logo-l{max-width:520px}
  .homegrid{display:flex;gap:22px;justify-content:center;align-items:stretch;margin:6px 0 10px}
  .shopcard{background:#fff;border:3px solid var(--lav);border-radius:24px;padding:10px 18px 12px;min-width:250px;text-align:center}
  .shopno{font-size:13px;font-weight:700;color:var(--sub)}
  .shopname{font-size:24px;font-weight:700;color:var(--deep);margin-top:-2px}
  .jar{width:150px;margin:2px auto 0}
  .jar svg{width:100%;height:auto;display:block}
  .jarnum{font-weight:700;color:var(--hot);font-size:18px}
  .jarnum small{color:var(--sub);font-size:13px}
  .homeside{display:flex;flex-direction:column;gap:12px;justify-content:center;width:360px;flex:none}
  #startBtn{font-size:26px;padding:18px 40px;border-radius:99px}
  .choco{background:#fff;border:3px solid #f0e2d0;border-radius:18px;padding:8px 14px;font-weight:700;color:#7b4a2a;text-align:left}
  .choco b{font-size:22px}
  .pens{background:#fff;border:3px solid var(--lav);border-radius:18px;padding:8px 12px;text-align:left}
  .pens .t{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
  .pens .dots{display:flex;flex-wrap:wrap;gap:7px}
  .pen{width:28px;height:28px;border-radius:50%;padding:0;min-width:0;border:3px solid #fff;box-shadow:0 0 0 2px #e6def9}
  .pen.sel{box-shadow:0 0 0 3px var(--purple)}
  .pen.lock{background:#eee !important;color:#bbb;font-size:12px;box-shadow:0 0 0 2px #eee}
  .pen.rainbow{background:conic-gradient(#f55,#fb3,#ee4,#5c6,#4bf,#86f,#f5c,#f55)}
  .hrow{display:flex;gap:10px}
  .hrow button{flex:1;border-radius:99px;font-size:16px;padding:10px}
  .shops{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin-top:6px;-webkit-overflow-scrolling:touch}
  .shopchip{flex:none;border-radius:16px;padding:6px 10px;font-size:13px;font-weight:700;background:#fff;border:2px solid var(--lav);color:var(--sub);text-align:center;min-width:72px}
  .shopchip .ic{font-size:18px;display:block}
  .shopchip.cur{border-color:var(--purple);color:var(--deep);box-shadow:0 3px 0 #d9cffb}
  .shopchip.done{border-color:#f0d86a;background:#fffbe0;color:#8a6d00}
  .shopchip.lock{opacity:.55}
  .qtag{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:#8a6d00;background:var(--yellow);border-radius:99px;padding:2px 10px}

  .note{margin:4px 0 0;font-size:12px;color:var(--sub);text-align:center}
  .reset{margin-top:4px;background:none;border:0;box-shadow:none;color:var(--sub);font-size:11px;font-weight:500;text-decoration:underline;padding:6px 10px;min-width:0}
  .reset:active{transform:none;box-shadow:none}
  /* 図鑑 */
  #zukan .card{flex:1;min-height:0;overflow:auto}
  .zhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .zhead h2{margin:0;font-size:24px;color:var(--deep)}
  .zshop{margin:12px 0 4px;font-weight:700;color:var(--sub)}
  .zgrid{display:flex;flex-wrap:wrap;gap:8px}
  .zc{background:#fff;border:3px solid var(--lav);border-radius:18px;padding:4px 12px 6px;text-align:center;min-width:64px}
  .zc .e{font-size:16px;line-height:1}
  .zc .k{font-family:"Klee One",serif;font-size:26px;font-weight:600;color:var(--ink);line-height:1.2}
  .zempty{color:var(--sub);padding:30px;text-align:center}

  /* モーダル */
  .modal{position:fixed;inset:0;background:rgba(80,60,140,.28);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal.on{display:flex}
  .mbox{background:#fff;border-radius:28px;padding:22px 24px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(80,60,140,.3);max-height:90vh;overflow:auto}
  .mbox h3{margin:4px 0 10px;font-size:24px;color:var(--deep)}
  .mbox p{margin:6px 0;color:var(--ink)}
  .mbox textarea{width:100%;height:84px;border-radius:14px;border:2px solid var(--lav);padding:8px;font-size:12px;font-family:monospace;-webkit-user-select:text;user-select:text}
  .mbox .bar{margin-top:12px}
  .rare{font-size:90px;line-height:1.1;animation:spin 1.6s ease-out}
  @keyframes spin{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.15) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
  .gain{margin:10px auto;display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:700}
  .gain div{background:#fff;border:3px solid var(--lav);border-radius:99px;padding:6px 18px}

  /* 正解の赤丸＋キラキラ */
  .stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
  .stamp i{display:block;width:62vmin;height:62vmin;border-radius:50%;border:5.5vmin solid #e8304a;transform:rotate(-8deg)}
  .stamp b{position:absolute;font-size:9vmin;line-height:1}
  .stamp em{position:absolute;bottom:14vh;font-style:normal;font-weight:700;font-size:26px;color:var(--deep);background:#fff;border-radius:99px;padding:6px 20px;box-shadow:0 6px 20px rgba(151,126,242,.3)}
  .stamp em:empty{display:none}
  .stamp b:nth-of-type(1){color:var(--yellow);transform:translate(-36vmin,-30vmin);-webkit-text-stroke:2px #e6d860}
  .stamp b:nth-of-type(2){color:var(--pink);transform:translate(34vmin,-26vmin)}
  .stamp b:nth-of-type(3){color:var(--blue);transform:translate(30vmin,30vmin)}
  .stamp b:nth-of-type(4){color:var(--purple);transform:translate(-32vmin,28vmin)}
  .stamp.go{animation:st .65s ease-out}
  @keyframes st{0%{opacity:0;transform:scale(1.6)}30%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}

  /* === Design polish v1.1 / writing screen only === */
  #play .card{padding:16px 22px 18px}
  #play .qhead{padding-bottom:8px}
  #play .qno{font-size:14px;padding:4px 16px;letter-spacing:.035em}
  #play .q{margin:8px 0 6px;line-height:1.45}
  #play .stage{gap:22px;align-items:flex-start}
  #play .collabel{height:24px;line-height:24px;font-size:15px;letter-spacing:.05em}
  #play .col{gap:8px}
  #play .divider{margin-top:32px;border-left-width:2px;opacity:.7}
  #play .cell,#play .anscell{border-radius:20px}
  #play .cell{box-shadow:0 4px 0 #d8cef8}
  #play .anscell{box-shadow:0 3px 0 #f5e4f5}
  #play .show .anscell{box-shadow:0 4px 0 #e9b8ed}
  #play .side{margin-top:32px;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
  #play .side .up{align-items:flex-end}
  #play .side .main{height:100px;border-radius:24px;font-size:22px}
  #play .side .pair{gap:10px}
  #play .side .pair .main{font-size:20px;border-radius:24px}
  #play .side .low{gap:10px}
  #play .side .low button{height:70px;border-radius:22px}
  #play .side .ghostbtn{height:58px;border-radius:22px}
  #play .side button{line-height:1.25}
  #play .msg{height:32px;min-height:32px;display:flex;align-items:center;justify-content:center;margin-top:8px;font-size:14px;line-height:1.35;letter-spacing:.01em}
  @media(max-height:700px){
    #play .card{padding:10px 16px}
    #play .qhead{padding-bottom:2px}
    #play .q{margin:3px 0}
    #play .msg{height:24px;min-height:24px;font-size:12px;margin-top:3px}
  }

  /* === Design polish v1.2 / home screen only === */
  #start .card{padding:22px 28px 18px}
  #start .logo-l{max-width:500px;margin:0 auto 4px}
  #start .q{font-size:25px;line-height:1.4;margin-bottom:12px!important}
  #start .homegrid{gap:20px;margin:10px auto 14px;max-width:780px;align-items:stretch}
  #start .shopcard{min-width:260px;padding:15px 20px 16px;border:2px solid #e7d6f7;border-radius:24px;
    box-shadow:0 4px 12px rgba(151,126,242,.07)}
  #start .shopno{font-size:13px;letter-spacing:.06em}
  #start .shopname{font-size:25px;margin:2px 0 4px;line-height:1.35}
  #start .jar{margin:6px auto 4px}
  #start .jarnum{font-size:19px}
  #start .homeside{width:350px;gap:12px;justify-content:center}
  #start #startBtn{width:100%;min-height:72px;font-size:27px;letter-spacing:.08em;
    border-radius:24px;box-shadow:0 6px 0 #6f58cf,inset 0 2px 0 rgba(255,255,255,.35)}
  #start #startBtn:active{box-shadow:0 2px 0 #6f58cf}
  #start .choco,#start .pens{border-width:2px;border-radius:20px;padding:12px 16px;
    box-shadow:0 3px 10px rgba(151,126,242,.06)}
  #start .pens .t{font-size:14px;margin-bottom:8px}
  #start .pens .dots{gap:10px}
  #start .hrow{gap:12px}
  #start .hrow button{min-height:52px;border-radius:18px;font-size:15px}
  #start .shops{max-width:780px;margin:8px auto 0;padding:6px 3px 10px;gap:9px}
  #start .shopchip{border-radius:14px;min-width:78px;padding:8px 11px;line-height:1.4}
  #start .note{font-size:12px;line-height:1.5;margin-top:10px}
  @media(max-width:760px){
    #start .card{padding:16px 14px}
    #start .homegrid{gap:12px}
    #start .shopcard{min-width:0;flex:1;padding:10px}
    #start .homeside{width:48%;gap:9px}
    #start .q{font-size:20px}
    #start #startBtn{min-height:58px;font-size:22px}
    #start .choco,#start .pens{padding:9px}
    #start .hrow{gap:7px}
    #start .hrow button{font-size:13px;padding:8px 5px;min-width:0}
  }

  /* === v1.3 / home screen single-viewport refinement === */
  #start .card{display:flex;flex-direction:column;align-items:stretch;overflow:hidden;padding:12px 24px 8px}
  #start .logo-l{flex:none;max-width:450px;margin:0 auto 0}
  #start .homegrid{flex:1;min-height:0;width:100%;max-width:790px;margin:4px auto 6px;gap:18px;align-items:stretch}
  #start .shopcard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;width:40%;padding:8px 12px}
  #start .shopname{font-size:clamp(19px,2.1vw,25px);margin:0}
  #start .jar{width:auto;max-width:140px;min-height:0;flex:0 1 220px;margin:3px auto;display:flex;align-items:center;justify-content:center}
  #start .jar svg{width:auto;height:100%;max-width:100%;object-fit:contain}
  #start .jarnum{font-size:17px;flex:none}
  #start .homeside{width:60%;max-width:440px;gap:10px;justify-content:center;min-height:0}
  #start #startBtn{min-height:62px;padding:12px 20px;font-size:25px}
  #start .rewardrow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:stretch}
  #start .rewardrow .choco{display:flex;align-items:center;justify-content:center;min-width:0;padding:8px 10px;font-size:15px;line-height:1.4;text-align:center}
  #start .rewardrow .choco b{font-size:19px}

const pad=n=>String(n).padStart(2,'0');
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const today=()=>dstr(new Date());
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const P=q=>S.p[q.key]||(S.p[q.key]={c:0,d:'',w:0});
const isDone=q=>(S.p[q.key]||{}).c>=2;               // 図鑑入り
const curShop=()=>Math.min(S.cleared.length,SHOPS.length-1);
const doneIn=si=>ALL.filter(q=>q.shop===si&&isDone(q)).length;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// ===== おまかせ出題（10問）=====
// 優先：①きのう以前に1回正解（今日正解で図鑑入り）②まちがえた問題 ③新しい問題 ④今日1回正解した問題
function omakase(n=10){
  const cs=curShop(),t=today();
  const pool=ALL.filter(q=>q.shop<=cs&&!isDone(q));
  const st=q=>S.p[q.key]||{c:0,d:'',w:0};
  const due=shuffle(pool.filter(q=>st(q).c===1&&st(q).d<t));
  const wr=shuffle(pool.filter(q=>st(q).c===0&&st(q).w>0));
  const fresh=shuffle(pool.filter(q=>st(q).c===0&&!st(q).w)).sort((a,b)=>b.shop-a.shop);
  const later=shuffle(pool.filter(q=>st(q).c===1&&st(q).d>=t));
  const order=[...due.slice(0,4),...wr.slice(0,3),...fresh,...due.slice(4),...wr.slice(3),...later];
  const out=[],used=new Set();
  for(const q of order){
    if(out.length>=n)break;if(used.has(q))continue;
    const grp=q.g?ALL.filter(x=>x.shop===q.shop&&x.g===q.g):[q];   // 同じ読みペアは続けて出す
    grp.forEach(x=>{if(!used.has(x)){used.add(x);out.push(x)}});
  }
  return out;
}

// ===== ホーム =====
function jarSVG(n,max){
  const cols=['#F1ACF2','#977EF2','#7EB0F2','#F2EDA0','#f59ab8','#9fe0c0','#ffc38a'];
  let c='';
  for(let i=0;i<Math.min(n,max);i++){
    const r=Math.floor(i/8),k=i%8,x=40+k*15+(r%2?7:0),y=232-r*15;
    c+=`<circle cx="${x}" cy="${y}" r="7" fill="${cols[(i*5+r)%cols.length]}" stroke="#fff" stroke-width="1.5"/>`;
  }
  return `<svg viewBox="0 0 190 260"><rect x="55" y="8" width="80" height="22" rx="8" fill="#F1ACF2" stroke="#e07fe2" stroke-width="3"/>
  <path d="M60,30 h70 v14 q30,8 30,36 v150 q0,22 -22,22 h-86 q-22,0 -22,-22 v-150 q0,-28 30,-36z" fill="rgba(255,255,255,.75)" stroke="#c9b8f5" stroke-width="4"/>
  ${c}<path d="M44,92 q0,-20 14,-26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/></svg>`;
}

// 1画面に収まるようにマスの大きさを計算（縦に並べる）
function fitBox(){
  const n=cells.length||1;
  const rows=Math.min(n,2), cols=Math.ceil(n/2);  // 縦書き：右の行から1行2文字まで
  const stage=$('stage');
  const h=stage.clientHeight-26-(rows-1)*8-4;   // ラベル分と隙間
  const w=(stage.clientWidth-180-28*3-4)/2-(cols-1)*8;    // 左右2列＋右のボタン列
  document.documentElement.style.setProperty('--n',rows);
  document.documentElement.style.setProperty('--cols',cols);
  const s=Math.floor(Math.max(90,Math.min(320,h/rows,w/cols)));
  document.documentElement.style.setProperty('--box',s+'px');
}

function renderQ(){
  const q=queue[idx],s=q.s,a=q.a,pr=S.p[q.key]||{c:0};
  setState('write');setOverlay(false);$('msg').textContent='';missed=false;
  $('qno').innerHTML=`第 ${idx+1} 問 / ${queue.length}`+(q.g?'　♪ 同じ読みペア':'')+
    (pr.c>=2?'<span class="qtag">図鑑にあるよ</span>':'');
  $('bar').style.width=(idx/queue.length*100)+'%';
  $('qtext').innerHTML=s.replace(/\[(.+?)\]/,'<span class="kata">$1</span>');
  const chars=[...a];
  const wc=$('writeCol'), ac=$('ansCol');
  wc.innerHTML='';ac.innerHTML='';cells=[];undoStack=[];
  chars.forEach((ch,i)=>{
    const cell=document.createElement('div');cell.className='cell';
    const cv=document.createElement('canvas');
    const g=document.createElement('div');g.className='ghost';g.textContent=ch;
    cell.append(cv,g);wc.append(cell);
    const an=document.createElement('div');an.className='anscell';an.textContent=ch;ac.append(an);
    cells.push(makeCell(cv,i));
  });
  fitBox();
  cells.forEach(sizeCanvas);
}

// 線は 0〜1 の相対座標で保存 → 画面回転やサイズ変更でも描き直せる
function makeCell(cv,i){
  const st={cv,ctx:cv.getContext('2d'),strokes:[],cur:null,w:1};
  const pos=e=>{const b=cv.getBoundingClientRect();
    return{x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height,p:e.pointerType==='pen'?(e.pressure||.5):.5}};
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen'&&!penSeen){penSeen=true;$('penPill').textContent='✎ ペンモード（手のひらOK）';$('penPill').classList.add('pen-on')}
    if(penSeen&&e.pointerType==='touch')return; // 手のひらの誤反応を無視
    if(state==='judge')return; // 判定中だけは書けない
    e.preventDefault();cv.setPointerCapture(e.pointerId);
    st.cur={id:e.pointerId,pts:[pos(e)]};
  });
  cv.addEventListener('pointermove',e=>{
    if(!st.cur||st.cur.id!==e.pointerId)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){const p=pos(ev);const pts=st.cur.pts;drawSeg(st,pts[pts.length-1],p);pts.push(p)}
  });
  const end=e=>{if(!st.cur||st.cur.id!==e.pointerId)return;
    if(st.cur.pts.length===1){const p=st.cur.pts[0];drawSeg(st,p,p)}
    st.strokes.push(st.cur.pts);undoStack.push(i);st.cur=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return st;
}
function sizeCanvas(st){
  const dpr=window.devicePixelRatio||1;const r=st.cv.getBoundingClientRect();
  st.w=r.width;st.cv.width=r.width*dpr;st.cv.height=r.height*dpr;
  st.ctx.setTransform(dpr,0,0,dpr,0,0);st.ctx.lineCap='round';st.ctx.lineJoin='round';st.ctx.strokeStyle='#1d1a17';
  redraw(st);
}
function penColor(a){const c=(PENS[S.pen]||PENS[0])[1];
  return c==='rainbow'?`hsl(${Math.round((a.x+a.y)*300)%360},85%,52%)`:c}
function drawSeg(st,a,b){const{ctx,w}=st;ctx.lineWidth=w*0.04*(0.55+b.p*0.9);ctx.strokeStyle=penColor(a);
  ctx.beginPath();ctx.moveTo(a.x*w,a.y*w);ctx.lineTo(b.x*w,b.y*w);ctx.stroke()}
function redraw(st){st.ctx.clearRect(0,0,st.w,st.w);
  for(const pts of st.strokes)for(let k=0;k<pts.length;k++)drawSeg(st,pts[Math.max(0,k-1)],pts[k])}

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(!$('play').classList.contains('active'))return;fitBox();cells.forEach(sizeCanvas)},120)});

// 状態：write（書く）→ judge（見比べる）→ rewrite（お手本に重ねて書き直す）
let state='write', missed=false;
function setState(s){state=s;const q=$('qcard');
  q.classList.remove('st-write','st-judge','st-rewrite');q.classList.add('st-'+s);
  q.classList.toggle('show',s!=='write')}
function setOverlay(on){$('qcard').classList.toggle('overlay',on);
  document.querySelectorAll('[data-act="overlay"]').forEach(b=>{b.classList.toggle('on',on);
    b.innerHTML=on?'重ねるのをやめる':'重ねる'})}
function undo(){const i=undoStack.pop();if(i===undefined)return;cells[i].strokes.pop();redraw(cells[i])}
function clearAll(){cells.forEach(c=>{c.strokes=[];redraw(c)});undoStack=[]}

document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act;
  if(a==='undo')undo();else if(a==='clear')clearAll();
  else if(a==='overlay')setOverlay(!$('qcard').classList.contains('overlay'));
}));
$('checkBtn').onclick=()=>setState('judge');
$('redoBtn').onclick=()=>{
  if(!missed){missed=true;wrong.push(queue[idx]);  // 1回目でまちがえた問題は記録
    const r=P(queue[idx]);if(r.c<2){r.c=0;r.d=''}r.w=(r.w||0)+1;save()}
  clearAll();setState('rewrite');setOverlay(false);
  $('msg').textContent='左の正しい字を見て書き直そう（「重ねる」でお手本が書く欄に出ます）';
};

let actx=null;
function chime(big){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;
    const notes=big?[1046.5,1318.5,1568,2093]:[1318.5,1568];  // ド・ミ・ソ・ド
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='triangle';o.frequency.value=f;
      const t=t0+i*0.09;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(big?.22:.14,t+.015);
      g.gain.exponentialRampToValueAtTime(.001,t+(i===notes.length-1?.6:.3));
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.7);
    });
  }catch(e){}
}
function stamp(msg){$('stampMsg').textContent=msg||'';const s=$('stamp');s.classList.remove('go');void s.offsetWidth;s.classList.add('go')}
// 正解の記録（ルールは画面に出さない）
// ・正解が2回つづいたら図鑑入り。ただし2回目は1回目と別の日でないと数えない
// ・1回正解したあとにまちがえたら、カウントは0から（まちがいの記録は「書き直す」で行う）
function record(q){
  const r=P(q),t=today();
  if(r.c>=2)return '';
  if(r.c===1&&r.d<t){r.c=2;r.d=t;save();sess.newZ++;return '🍭 図鑑に入ったよ！'}
  if(r.c===1)return '';            // 同じ日の2回目：数えない
  r.c=1;r.d=t;save();return '';
}
$('okBtn').onclick=()=>{let m='';if(!missed){okCount++;updateScore();m=record(queue[idx])}chime(false);stamp(m);next()}; // ★は1回目で正解したときだけ
$('doneBtn').onclick=()=>{chime(false);next()};
// もう一度：今の問題を最初から解き直す（正しい字はかくす）
$('againQBtn').onclick=()=>{clearAll();setOverlay(false);setState('write');$('msg').textContent='もう一度チャレンジ！'};

function next(){
  idx++;
  if(idx<queue.length){setTimeout(renderQ,250);return}
  $('bar').style.width='100%';
  const n=queue.length;
  $('resScore').textContent=`${okCount} / ${n}`;
  $('resMsg').textContent=okCount===n?'全問正解！すばらしい！':okCount>=n*0.7?'よくできました。まちがえた字をもう一回！':'まちがえた字を練習しよう';
  $('wrongList').innerHTML=wrong.map(q=>`<div>${q.s.replace(/\[(.+?)\]/,'$1')}<b>${q.a}</b></div>`).join('');
  $('retryWrongBtn').style.display=wrong.length?'':'none';
  const gain=[];
  if(sess.newZ)gain.push(`📖 図鑑に +${sess.newZ} 個`);
  const c=S.choco,t=today();
  if(c.last!==t){c.streak=c.last===yesterday()?c.streak+1:1;c.n++;c.last=t;
    gain.push(`🍫 今日のチョコ ゲット！（${c.streak}日目）`)}
  const cs=curShop();
  const cleared=SHOPS[cs].qs.length&&!S.cleared.includes(cs)&&doneIn(cs)>=need(cs);
  if(cleared)S.cleared.push(cs);
  save();
  $('resGain').innerHTML=gain.map(x=>`<div>${x}</div>`).join('');
  setTimeout(()=>{show('result');
    if(cleared){const nx=SHOPS[cs+1],pen=PENS[S.cleared.length];
      chime(true);setTimeout(()=>chime(true),350);
      modal(`<div class="rare">🍬</div><h3>${SHOPS[cs].ic} ${SHOPS[cs].name} クリア！</h3>
        <p><b>✨ レアキャンディ</b> をゲット！</p>
        ${pen?`<p>新しいペンの色「<b style="color:${pen[1]==='rainbow'?'#e0559a':pen[1]}">${pen[0]}</b>」が使えるよ</p>`:''}
        ${nx?`<p>次は ${nx.ic} <b>${nx.name}</b> がオープン！</p>`:'<p>ぜんぶのお店をクリア！</p>'}
        <div class="bar"><button class="primary" data-close>やったね！</button></div>`)}
  },300);
}
// ===== 画面の拡大を止める（iPadのSafariはviewportの指定だけでは止まらない）=====
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t,e=>e.preventDefault(),{passive:false}));      // ピンチ拡大
document.addEventListener('touchmove',e=>{
  if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});   // 2本指
let lastTouch=0;
document.addEventListener('touchend',e=>{                                     // すばやい2回タップ
  const now=Date.now();
  if(now-lastTouch<350&&!e.target.closest('textarea,input,button,a,canvas'))e.preventDefault();  // ボタン連打・書く欄はそのまま
  lastTouch=now},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
renderHome();
</script>
</body>
</html>
