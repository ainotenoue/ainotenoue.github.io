<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KANJI CANDY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#F1ACF2; --lav:#EFD5F2; --purple:#977EF2; --blue:#7EB0F2; --yellow:#F2EDA0;
    --ink:#3f3266; --sub:#8a7fb0; --deep:#6a52d9; --hot:#d966da;
    --paper:#ffffff; --box:200px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;color:var(--ink);overflow:hidden;
    font-family:"Zen Maru Gothic",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  /* 背景：ラベンダーのグラデーション＋水玉 */
  body{background:
      radial-gradient(circle at 12% 18%,rgba(241,172,242,.45) 0 3px,transparent 4px) 0 0/90px 90px,
      radial-gradient(circle at 60% 70%,rgba(255,255,255,.7) 0 2.5px,transparent 3.5px) 0 0/90px 90px,
      radial-gradient(circle at 85% 30%,rgba(242,237,160,.9) 0 3px,transparent 4px) 0 0/130px 130px,
      linear-gradient(160deg,#e9f5e4 0%,#d9eedb 50%,#d3ebe2 100%)}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:10px 16px 12px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
  h1{margin:0;line-height:0}
  .logo-s svg{height:38px;width:auto;display:block}
  .logo-l{max-width:620px;margin:0 auto 6px}
  .logo-l svg{width:100%;height:auto;display:block}
  .meta{font-size:14px;color:var(--sub);display:flex;gap:10px;align-items:center}
  .pill{background:rgba(255,255,255,.75);border:2px solid #fff;border-radius:999px;padding:3px 12px;font-weight:700;box-shadow:0 2px 6px rgba(151,126,242,.15)}
  .home{color:var(--deep);text-decoration:none}
  .pen-on{color:var(--deep);background:#fff}
  #score{background:var(--yellow);color:#8a6d00;border-color:#fff}
  .progress{height:10px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;margin:8px 0;flex:none;box-shadow:inset 0 1px 2px rgba(151,126,242,.2)}
  .progress i{display:block;height:100%;width:0;transition:width .4s;border-radius:99px;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue))}

  .screen{display:none;flex:1;min-height:0}
  .screen.active{display:flex;flex-direction:column}
  .card{background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:28px;padding:14px 18px;
    box-shadow:0 10px 30px rgba(151,126,242,.18),0 0 0 1px rgba(151,126,242,.08)}

  /* 問題画面 */
  #play .card{flex:1;min-height:0;display:flex;flex-direction:column}
  .qhead{flex:none;text-align:center}
  .qno{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--purple);border-radius:99px;padding:2px 12px}
  .q{font-family:"Klee One",serif;font-size:28px;line-height:1.5;margin:4px 0 8px;color:var(--ink)}
  .q .kata{color:var(--hot);font-weight:600;padding:0 4px;border-radius:6px;
    background:linear-gradient(transparent 62%,var(--yellow) 62%)}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;gap:28px}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .collabel{font-size:14px;font-weight:700;color:var(--sub);height:20px}
  .colboxes{display:grid;grid-template-rows:repeat(var(--n,1),var(--box));grid-auto-columns:var(--box);grid-auto-flow:column;direction:rtl;gap:8px}
  .divider{align-self:stretch;width:0;border-left:3px dotted var(--pink);margin-top:26px}

  .cell,.anscell{position:relative;width:var(--box);height:var(--box);border-radius:18px;background:#fff;
    background-image:
      repeating-linear-gradient(to bottom,#f3c6f4 0 6px,transparent 6px 12px),
      repeating-linear-gradient(to right,#f3c6f4 0 6px,transparent 6px 12px);
    background-size:2px 100%,100% 2px;background-position:center,center;background-repeat:no-repeat}
  .cell{border:3px solid var(--purple);box-shadow:0 4px 0 #d9cffb}
  .cell canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:15px}
  .anscell{border:3px solid var(--lav);display:flex;align-items:center;justify-content:center;
    font-family:"Klee One",serif;font-size:calc(var(--box)*.8);line-height:1;color:transparent;transition:color .25s,border-color .25s}
  .anscell::after{content:"？";position:absolute;font-family:"Zen Maru Gothic";font-weight:700;font-size:calc(var(--box)*.3);color:var(--lav)}
  .show .anscell{color:var(--ink);border-color:var(--pink);box-shadow:0 4px 0 #f6d3f7}
  .show .anscell::after{content:none}
  .ghost{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;
    font-family:"Klee One",serif;font-size:calc(var(--box)*.8);line-height:1;color:rgba(217,102,218,.32)}
  .overlay .ghost{display:flex}

  /* ボタン：ぷっくりした丸いキャンディ型 */
  button{font-family:inherit;font-weight:700;font-size:17px;border-radius:22px;border:none;cursor:pointer;
    background:#fff;color:var(--deep);padding:10px 18px;min-width:100px;
    box-shadow:0 5px 0 #d9cffb,inset 0 0 0 3px var(--lav);transition:transform .08s,box-shadow .08s}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #d9cffb,inset 0 0 0 3px var(--lav)}
  button.primary{color:#fff;background:linear-gradient(180deg,#a993f6,var(--purple));
    box-shadow:0 5px 0 #6f58cf,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(80,50,180,.35)}
  button.primary:active{box-shadow:0 1px 0 #6f58cf}
  button.ok{color:#fff;background:linear-gradient(180deg,#f6c3f7,var(--pink) 45%,#e48fe6);
    box-shadow:0 5px 0 #c66ec8,inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 1px 3px rgba(160,50,170,.45)}
  button.ok:active{box-shadow:0 1px 0 #c66ec8}
  button.ng{color:#fff;background:linear-gradient(180deg,#a3c8f7,var(--blue));
    box-shadow:0 5px 0 #5b8fd6,inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 1px 2px rgba(40,80,160,.4)}
  button.ng:active{box-shadow:0 1px 0 #5b8fd6}
  .ghostbtn{background:var(--yellow);color:#7a6400;box-shadow:0 5px 0 #d8d070}
  .ghostbtn:active{box-shadow:0 1px 0 #d8d070}
  .ghostbtn.on{background:#fff7a8;color:#7a6400;box-shadow:0 5px 0 #d8d070,inset 0 0 0 3px #e3d85a}

  .bar{flex:none;display:flex;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  /* 中心線の上にメイン、下に消す系／書き直す、いちばん下に「重ねる」 */
  .side{display:none;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:18px;width:180px;
    margin-top:26px;height:calc(var(--n)*var(--box) + (var(--n) - 1)*8px)}
  .side .up,.side .down{min-height:0}
  .side button{min-width:0;padding:8px 6px;font-size:17px;line-height:1.3}
  .side .up{display:flex;align-items:flex-end}
  .side .main{height:110px;width:100%;font-size:23px;border-radius:30px}
  .side .pair{gap:10px}
  .side .pair .main{flex:1;font-size:21px;line-height:1.25;border-radius:26px}
  .side .down{display:flex;flex-direction:column;justify-content:space-between;gap:12px;overflow:visible}
  .side .down>*{flex:none}
  .side .low{display:flex;gap:10px}
  .side .low button{flex:1;height:76px}
  .side .ghostbtn{height:60px;width:100%;border-radius:99px}
  .side button.ng{font-size:20px}
  #qcard.st-write .side.write,#qcard.st-judge .side.judge,#qcard.st-rewrite .side.rewrite{display:grid}
  .msg{height:22px;font-size:15px;font-weight:700;color:var(--hot);text-align:center;margin-top:8px;flex:none}

  /* スタート・結果 */
  .center{text-align:center}
  .scroll{overflow:auto}
  #start .card,#result .card{margin:auto 0;padding:34px 24px}
  .hero{font-size:46px;letter-spacing:.3em;margin:0 0 4px}
  .hero span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .hero span:nth-child(2){animation-delay:.3s}.hero span:nth-child(3){animation-delay:.6s}
  @keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
  .big{font-size:60px;font-weight:700;margin:8px 0;
    background:linear-gradient(90deg,var(--hot),var(--purple),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:16px 0;text-align:left}
  .list div{background:#fff;border:3px solid var(--lav);border-radius:18px;padding:8px 14px;font-family:"Klee One",serif;font-size:17px}
  .list b{color:var(--hot);font-size:24px;margin-left:6px}
  .choice{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0 22px}
  .choice button{border-radius:99px;min-width:96px}
  .choice button.sel{color:#fff;background:var(--blue);box-shadow:0 5px 0 #5b8fd6}
  #startBtn{font-size:24px;padding:16px 56px;border-radius:99px}

  /* 正解の赤丸＋キラキラ */
  .stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
  .stamp i{display:block;width:62vmin;height:62vmin;border-radius:50%;border:5.5vmin solid #e8304a;transform:rotate(-8deg)}
  .stamp b{position:absolute;font-size:9vmin;line-height:1}
  .stamp b:nth-of-type(1){color:var(--yellow);transform:translate(-36vmin,-30vmin);-webkit-text-stroke:2px #e6d860}
  .stamp b:nth-of-type(2){color:var(--pink);transform:translate(34vmin,-26vmin)}
  .stamp b:nth-of-type(3){color:var(--blue);transform:translate(30vmin,30vmin)}
  .stamp b:nth-of-type(4){color:var(--purple);transform:translate(-32vmin,28vmin)}
  .stamp.go{animation:st .65s ease-out}
  @keyframes st{0%{opacity:0;transform:scale(1.6)}30%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
</style>
</head>

  <!-- 問題 -->
  <section class="screen" id="play">

        <div class="q" id="qtext"></div>
      </div>
      <div class="stage" id="stage">
        <div class="col">

        </div>
        <div class="divider"></div>

        <div class="side write">
          <div class="up"><button class="main primary" id="checkBtn">答え</button></div>
          <div class="down"><div class="low"><button data-act="clear">全部<br>消す</button><button data-act="undo">1画<br>戻す</button></div></div>

          <div class="down"><div class="low"><button class="ng" id="redoBtn">書き直す</button></div>

        </div>

        <div class="side rewrite">

            <button class="ghostbtn" data-act="overlay">重ねる</button></div>
        </div>
      </div>

    </div>

      <div class="list" id="wrongList"></div>
      <div class="bar">
        <button id="retryWrongBtn" class="primary">まちがえた問題だけ</button>
        <button id="againBtn">新しく始める</button>
      </div>
    </div>
  </section>
</div>
<div class="stamp" id="stamp"><i></i><b>★</b><b>♥</b><b>✦</b><b>★</b></div>

<script>
// ===== Aランク 100問 =====
// [問題文（[ ]がカタカナ部分）, 答え, ペア名（同音・同訓ペアは続けて出題）]
const BANK = [
  // ── 同音異義語・同訓異字ペア（20問）
  ["鏡に自分の姿を[ウツ]す","映","うつす"],["本だなを窓ぎわに[ウツ]す","移","うつす"],
  ["この店はリンゴの[タンカ]が安い","単価","たんか"],["旅の思い出を[タンカ]によむ","短歌","たんか"],
  ["先生の[シジ]にしたがう","指示","しじ"],["友だちの意見を[シジ]する","支持","しじ"],
  ["ストップウォッチで時間を[ハカ]る","計","はかる"],["はかりで小麦粉の重さを[ハカ]る","量","はかる"],
  ["[アツ]い辞書を開く","厚","あつい"],["[アツ]いスープをふいて飲む","熱","あつい"],
  ["宇宙に[カンシン]をもつ","関心","かんしん"],["弟のがんばりに[カンシン]する","感心","かんしん"],
  ["テストは[イガイ]なほどやさしかった","意外","いがい"],["日曜[イガイ]は練習がある","以外","いがい"],
  ["期日までに税金を[オサ]める","納","おさめる"],["昔、この地を王が[オサ]めた","治","おさめる"],
  ["小学生を[タイショウ]にした大会","対象","たいしょう"],["姉と妹は[タイショウ]的な性格だ","対照","たいしょう"],
  ["父は銀行に[ツト]めている","勤","つとめる"],["学級委員長を[ツト]める","務","つとめる"],

  // ── 四字熟語（10問）
  ["[リッシンシュッセ]をゆめみる","立身出世"],["[ネンコウジョレツ]の会社","年功序列"],
  ["試合は[イッシンイッタイ]の攻防が続いた","一進一退"],["みんなが[イクドウオン]に賛成した","異口同音"],
  ["自分の絵を[ジガジサン]する","自画自賛"],["[イッセキニチョウ]のアイデア","一石二鳥"],
  ["[タントウチョクニュウ]にたずねる","単刀直入"],["作文の[キショウテンケツ]を考える","起承転結"],
  ["[リンキオウヘン]に対応する","臨機応変"],["話を[ハンシンハンギ]で聞く","半信半疑"],

  // ── 送りがなつき・1字の訓読み（25問）
  ["石を積んで城を[キズ]く","築"],["思い出を心に[キザ]む","刻"],["トラックに荷物を[ツ]む","積"],
  ["お年寄りを[ウヤマ]う","敬"],["白い布を青く[ソ]める","染"],["勇気を[フル]って発表する","奮"],
  ["グループで作戦を[ネ]る","練"],["ブリを[テ]り焼きにする","照"],["最後まで責任を[ハ]たす","果"],
  ["寒いので窓を[シ]める","閉"],["胸を[ハ]って歩く","張"],["森の中で道に[マヨ]う","迷"],
  ["姉の合格を[イワ]う","祝"],["二列に[ナラ]んで歩く","並"],["柱で屋根を[ササ]える","支"],
  ["シャワーを[ア]びる","浴"],["落とし物を交番に[トド]ける","届"],["スープが[サ]めてしまう","冷"],
  ["祖母の家を[タズ]ねる","訪"],["転んで足の骨を[オ]る","折"],["つり糸を川に[タ]らす","垂"],
  ["ボウルに卵を[ワ]る","割"],["川の水かさが[マ]す","増"],["仕事を部下に[マカ]せる","任"],
  ["はさみで紙を[タ]つ","断"],

  // ── 2字・3字熟語（45問）
  ["古い商店街が[ソンゾク]の危機にある","存続"],["昔の写真を見て[カンショウ]にひたる","感傷"],
  ["大地震の[ゼンチョウ]を調べる","前兆"],["ロボットが海底を[タンサ]する","探査"],
  ["[ゲントウ]の山で星を見る","厳冬"],["市が新しい決まりを[コクジ]する","告示"],
  ["お年寄りを[ユウセン]して座らせる","優先"],["外国のお客さんの[ツウヤク]をする","通訳"],
  ["がけにしま模様の[チソウ]が見える","地層"],["[セイヤ]に教会のかねが鳴る","聖夜"],
  ["騎士が王に[チュウセイ]をちかう","忠誠"],["[ジシャク]で砂鉄を集める","磁石"],
  ["親[コウコウ]な息子","孝行"],["取りあつかいに注意する[ゲキヤク]","劇薬"],
  ["[センレン]されたデザインの服","洗練"],["はずかしくて顔が[コウチョウ]する","紅潮"],
  ["市役所の[チョウシャ]を建てかえる","庁舎"],["[カンレイ]な地域で育つ作物","寒冷"],
  ["地域に古くから伝わる[カンシュウ]","慣習"],["[キリツ]正しい生活を送る","規律"],
  ["遠足の[ヨクジツ]は雨だった","翌日"],["[シキュウ]連絡してください","至急"],
  ["実験の[ケイカ]をノートに記録する","経過"],["二人だけの[ヒミツ]","秘密"],
  ["今年の[ホウシン]をみんなで決める","方針"],["話し合って[ゴカイ]をとく","誤解"],
  ["お年玉を銀行に[ヨキン]する","預金"],["日本の[ケンポウ]について学ぶ","憲法"],
  ["新しいクラスで[ジコ]しょうかいをする","自己"],["外国との[ボウエキ]がさかんな港","貿易"],
  ["[ショウボウ]車がサイレンを鳴らす","消防"],["勝てると[カクシン]する","確信"],
  ["[ユウビン]局で切手を買う","郵便"],["いつも[セイケツ]なハンカチを持つ","清潔"],
  ["[チイキ]の清そう活動に参加する","地域"],["昆虫の[センモン]家に話を聞く","専門"],
  ["卒業式で来賓が[シュクジ]を述べる","祝辞"],["日本列島を[ジュウダン]する旅","縦断"],
  ["本番で実力を[ハッキ]する","発揮"],["吹奏楽部の[エンソウ]会","演奏"],
  ["先生を[ソンケイ]している","尊敬"],["目上の人には[ケイゴ]を使う","敬語"],
  ["[ジュンジョ]よく並ぶ","順序"],["[セイミツ]な機械を組み立てる","精密"],
  ["会議に[ユウシキシャ]を招く","有識者"],
];

let queue=[], idx=0, okCount=0, wrong=[], count=10;
let cells=[], undoStack=[], penSeen=false;
const $=id=>document.getElementById(id);

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

$('countChoice').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  count=+b.dataset.n;[...$('countChoice').children].forEach(x=>x.classList.toggle('sel',x===b));
});
// ペア（3つ目の値が同じ問題）はひとまとまりにしてシャッフル
function units(list){const m=new Map(),out=[];
  list.forEach(q=>{if(q[2]){if(!m.has(q[2])){m.set(q[2],[]);out.push(m.get(q[2]))}m.get(q[2]).push(q)}else out.push([q])});
  return out}
function pick(list,n){const r=[];for(const u of shuffle(units(list))){if(r.length+u.length<=n)r.push(...u);if(r.length>=n)break}return r}
$('startBtn').onclick=()=>begin(pick(BANK,count));
$('againBtn').onclick=()=>{$('bar').style.width='0';show('start')};
$('retryWrongBtn').onclick=()=>begin(pick(wrong,wrong.length));

function begin(list){queue=list;idx=0;okCount=0;wrong=[];updateScore();show('play');renderQ()}
function updateScore(){$('score').textContent='★ '+okCount}

// 1画面に収まるようにマスの大きさを計算（縦に並べる）
function fitBox(){
  const n=cells.length||1;
  const rows=Math.min(n,2), cols=Math.ceil(n/2);  // 縦書き：右の行から1行2文字まで
  const stage=$('stage');
  const h=stage.clientHeight-26-(rows-1)*8-4;   // ラベル分と隙間
  const w=(stage.clientWidth-180-28*3-4)/2-(cols-1)*8;    // 左右2列＋右のボタン列
  document.documentElement.style.setProperty('--n',rows);
  document.documentElement.style.setProperty('--cols',cols);
  const s=Math.floor(Math.max(90,Math.min(320,h/rows,w/cols)));
  document.documentElement.style.setProperty('--box',s+'px');
}

function renderQ(){
  const [s,a]=queue[idx];
  setState('write');setOverlay(false);$('msg').textContent='';missed=false;
  $('qno').textContent=`第 ${idx+1} 問 / ${queue.length}`+(queue[idx][2]?'　♪ 同じ読みペア':'');
  $('bar').style.width=(idx/queue.length*100)+'%';
  $('qtext').innerHTML=s.replace(/\[(.+?)\]/,'<span class="kata">$1</span>');
  const chars=[...a];
  const wc=$('writeCol'), ac=$('ansCol');
  wc.innerHTML='';ac.innerHTML='';cells=[];undoStack=[];
  chars.forEach((ch,i)=>{
    const cell=document.createElement('div');cell.className='cell';
    const cv=document.createElement('canvas');
    const g=document.createElement('div');g.className='ghost';g.textContent=ch;
    cell.append(cv,g);wc.append(cell);
    const an=document.createElement('div');an.className='anscell';an.textContent=ch;ac.append(an);
    cells.push(makeCell(cv,i));
  });
  fitBox();
  cells.forEach(sizeCanvas);
}

// 線は 0〜1 の相対座標で保存 → 画面回転やサイズ変更でも描き直せる
function makeCell(cv,i){
  const st={cv,ctx:cv.getContext('2d'),strokes:[],cur:null,w:1};
  const pos=e=>{const b=cv.getBoundingClientRect();
    return{x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height,p:e.pointerType==='pen'?(e.pressure||.5):.5}};
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen'&&!penSeen){penSeen=true;$('penPill').textContent='✎ ペンモード（手のひらOK）';$('penPill').classList.add('pen-on')}
    if(penSeen&&e.pointerType==='touch')return; // 手のひらの誤反応を無視
    if(state==='judge')return; // 判定中だけは書けない
    e.preventDefault();cv.setPointerCapture(e.pointerId);
    st.cur={id:e.pointerId,pts:[pos(e)]};
  });
  cv.addEventListener('pointermove',e=>{
    if(!st.cur||st.cur.id!==e.pointerId)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){const p=pos(ev);const pts=st.cur.pts;drawSeg(st,pts[pts.length-1],p);pts.push(p)}
  });
  const end=e=>{if(!st.cur||st.cur.id!==e.pointerId)return;
    if(st.cur.pts.length===1){const p=st.cur.pts[0];drawSeg(st,p,p)}
    st.strokes.push(st.cur.pts);undoStack.push(i);st.cur=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  return st;
}
function sizeCanvas(st){
  const dpr=window.devicePixelRatio||1;const r=st.cv.getBoundingClientRect();
  st.w=r.width;st.cv.width=r.width*dpr;st.cv.height=r.height*dpr;
  st.ctx.setTransform(dpr,0,0,dpr,0,0);st.ctx.lineCap='round';st.ctx.lineJoin='round';st.ctx.strokeStyle='#1d1a17';
  redraw(st);
}
function drawSeg(st,a,b){const{ctx,w}=st;ctx.lineWidth=w*0.04*(0.55+b.p*0.9);
  ctx.beginPath();ctx.moveTo(a.x*w,a.y*w);ctx.lineTo(b.x*w,b.y*w);ctx.stroke()}
function redraw(st){st.ctx.clearRect(0,0,st.w,st.w);
  for(const pts of st.strokes)for(let k=0;k<pts.length;k++)drawSeg(st,pts[Math.max(0,k-1)],pts[k])}

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(!$('play').classList.contains('active'))return;fitBox();cells.forEach(sizeCanvas)},120)});

// 状態：write（書く）→ judge（見比べる）→ rewrite（お手本に重ねて書き直す）
let state='write', missed=false;
function setState(s){state=s;const q=$('qcard');
  q.classList.remove('st-write','st-judge','st-rewrite');q.classList.add('st-'+s);
  q.classList.toggle('show',s!=='write')}
function setOverlay(on){$('qcard').classList.toggle('overlay',on);
  document.querySelectorAll('[data-act="overlay"]').forEach(b=>{b.classList.toggle('on',on);
    b.innerHTML=on?'重ねるのをやめる':'重ねる'})}
function undo(){const i=undoStack.pop();if(i===undefined)return;cells[i].strokes.pop();redraw(cells[i])}
function clearAll(){cells.forEach(c=>{c.strokes=[];redraw(c)});undoStack=[]}

document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act;
  if(a==='undo')undo();else if(a==='clear')clearAll();
  else if(a==='overlay')setOverlay(!$('qcard').classList.contains('overlay'));
}));
$('checkBtn').onclick=()=>setState('judge');
$('redoBtn').onclick=()=>{
  if(!missed){missed=true;wrong.push(queue[idx])}  // 1回目でまちがえた問題は記録
  clearAll();setState('rewrite');setOverlay(false);
  $('msg').textContent='左の正しい字を見て書き直そう（「重ねる」でお手本が書く欄に出ます）';
};

let actx=null;
function chime(big){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t0=actx.currentTime;
    const notes=big?[1046.5,1318.5,1568,2093]:[1318.5,1568];  // ド・ミ・ソ・ド
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='triangle';o.frequency.value=f;
      const t=t0+i*0.09;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(big?.22:.14,t+.015);
      g.gain.exponentialRampToValueAtTime(.001,t+(i===notes.length-1?.6:.3));
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.7);
    });
  }catch(e){}
}
function stamp(){const s=$('stamp');s.classList.remove('go');void s.offsetWidth;s.classList.add('go')}
$('okBtn').onclick=()=>{if(!missed){okCount++;updateScore()}chime(true);stamp();next()}; // ★は1回目で正解したときだけ
$('doneBtn').onclick=()=>{chime(false);next()};
// もう一度：今の問題を最初から解き直す（正しい字はかくす）
$('againQBtn').onclick=()=>{clearAll();setOverlay(false);setState('write');$('msg').textContent='もう一度チャレンジ！'};

function next(){
  idx++;
  if(idx<queue.length){setTimeout(renderQ,250);return}
  $('bar').style.width='100%';
  const n=queue.length;
  $('resScore').textContent=`${okCount} / ${n}`;
  $('resMsg').textContent=okCount===n?'全問正解！すばらしい！':okCount>=n*0.7?'よくできました。まちがえた字をもう一回！':'まちがえた字を練習しよう';
  $('wrongList').innerHTML=wrong.map(([s,a])=>`<div>${s.replace(/\[(.+?)\]/,'$1')}<b>${a}</b></div>`).join('');
  $('retryWrongBtn').style.display=wrong.length?'':'none';
  setTimeout(()=>show('result'),300);
}
</script>
