<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>頻出テーマの解説｜鎌倉国際文理中学校</title><style>
:root{--ink:#24324c;--blue:#4168a7;--sub:#65748b}*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.75}main{max-width:850px;margin:auto;padding:22px 18px 70px}a{color:var(--blue)}.back{text-decoration:none;font-weight:700}.panel{background:white;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 5px 20px #30466b0b}h1{font-size:clamp(25px,4vw,36px);line-height:1.4}h2{font-size:20px;margin:0 0 12px}.sub{color:var(--sub)}.label{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--blue)}.example{background:#f1f6fd;border-radius:14px;padding:18px;font-weight:700;font-size:18px;white-space:pre-wrap}.answer{background:#edf8f2;border-radius:12px;padding:15px;margin-top:14px}.answer[hidden]{display:none}button{border:0;border-radius:12px;background:var(--blue);color:white;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid orange;outline-offset:2px}li{margin:7px 0}.nav{display:flex;flex-wrap:wrap;gap:8px}.nav a{padding:7px 12px;border-radius:999px;background:#eaf0fa;text-decoration:none;font-size:13px;font-weight:700}.nav a.current{background:var(--blue);color:white}.note{font-size:13px;color:#725a2e;background:#fff8e8;padding:12px;border-radius:10px}@media(max-width:600px){.panel{padding:17px}}</style></head><body><main><a class="back" href="./">← 分析トップへ</a><header><p class="label">FREQUENT TOPIC GUIDE</p><h1 id="title"></h1><p class="sub" id="years"></p></header><section class="panel"><h2>何を問う問題が出題されているか</h2><p id="asks"></p><h2>出題の型</h2><ul id="patterns"></ul></section><section class="panel"><h2>オリジナル例題</h2><p class="sub">過去問の転載ではなく、分析した解法の型をもとに作成した練習用例題です。</p><div class="example" id="question"></div><p><button id="show" aria-expanded="false">答え・考え方を見る</button></p><div class="answer" id="answer" hidden><strong id="result"></strong><ol id="steps"></ol></div></section><section class="panel"><h2>つまずきやすいポイント</h2><p id="pitfall"></p></section><section class="panel"><h2>他の頻出テーマ</h2><nav class="nav" id="nav"></nav></section><p class="note">年度・設問番号は既存の一次分類に基づきます。原本PDFとの再照合前の暫定整理であり、出題文そのものを掲載したものではありません。</p></main><script>
const THEMES=[{"id":"inverse","name":"逆算・□の式","years":"令和6・7・8年 大問2-(2)","asks":"□を含む式から、計算の順序を逆にたどって未知数を求められるか。","patterns":["かっこ内の□を求める","掛け算・割り算を含む式を逆向きに処理する"],"q":"(□ × 3 ＋ 12) ÷ 4 ＝ 15 のとき、□はいくつですか。","a":"16","steps":["両辺を4倍して、□ × 3 ＋ 12 ＝ 60","12を引いて、□ × 3 ＝ 48","3で割って、□ ＝ 16"],"pitfall":"演算の逆順を間違える。まず外側の「÷4」から戻す。"},{"id":"average","name":"平均算","years":"令和6・7・8年 大問2-(4)","asks":"平均を合計に直し、人数や個数を使って未知の値を求められるか。","patterns":["平均から未知の数値を求める","グループごとの平均から全体平均を求める","全体平均から一方の平均を逆算する"],"q":"5人の平均点は72点です。うち3人の平均点が80点なら、残り2人の平均点は何点ですか。","a":"60点","steps":["5人の合計は72×5＝360点","3人の合計は80×3＝240点","残り2人の合計は360−240＝120点","120÷2＝60点"],"pitfall":"平均同士をそのまま足したり引いたりしない。必ず合計に戻す。"},{"id":"ratio","name":"割合・逆算","years":"令和6・7・8年 大問2-(5)","asks":"割合を掛ける順序や、元の量を逆算する力が問われる。","patterns":["所持金の一部を使った残金から元を求める","割引と消費税を順に適用し定価を逆算する"],"q":"定価から20%引きした後、消費税10%を加えると1760円になりました。定価はいくらですか。","a":"2000円","steps":["税込み価格1760÷1.1＝1600円","割引後の価格は定価の80%","1600÷0.8＝2000円"],"pitfall":"20%引きと10%の税を単純に足し引きしない。どの金額を基準にするか確認する。"},{"id":"salt","name":"食塩水","years":"令和6・7・8年 大問2-(6)","asks":"食塩の量と食塩水全体の量を分けて扱い、濃度を求められるか。","patterns":["食塩を追加した後の濃度","異なる濃度の食塩水を混ぜた後の濃度"],"q":"4%の食塩水100gと10%の食塩水50gを混ぜました。濃度は何%ですか。","a":"6%","steps":["食塩の量は100×0.04＝4gと50×0.10＝5g","食塩は合計9g、食塩水は合計150g","9÷150×100＝6%"],"pitfall":"4%と10%の単純平均を取らない。食塩の量を先に求める。"},{"id":"speed","name":"速さのグラフ","years":"令和6・7・8年 大問3","asks":"距離と時間のグラフを読み、移動・停止・出発時刻の違いを数量に変換できるか。","patterns":["グラフの傾きから速さを求める","水平部分を停止時間と読む","時間差や出会い・追いつきの条件を整理する"],"q":"家から1200m離れた公園まで、出発から10分で着きました。途中で2分間止まり、それ以外は一定の速さで歩きました。歩いたときの分速は何mですか。","a":"分速150m","steps":["歩いていた時間は10−2＝8分","1200÷8＝150","分速150m"],"pitfall":"停止時間も歩行時間に含めて割らない。グラフでは水平部分を見つける。"},{"id":"circle","name":"円を含む面積","years":"令和6・7・8年 大問2-(9)など","asks":"円・正方形・長方形を組み合わせ、斜線部分を差や分割で求められるか。","patterns":["円と正方形の面積差","円弧・弦を含む図形の分割","重なる部分を正しく引く"],"q":"一辺10cmの正方形に内接する円があります。正方形の中で円の外側にある部分の面積は何cm²ですか。円周率は3.14とします。","a":"21.5cm²","steps":["正方形の面積は10×10＝100cm²","円の半径は5cm、面積は5×5×3.14＝78.5cm²","100−78.5＝21.5cm²"],"pitfall":"円の直径と半径を混同しない。図にどの部分を引くか書き込む。"},{"id":"logic","name":"条件整理・場合分け","years":"令和6・7・8年 大問5","asks":"複数の条件を同時に満たす場合を、重複・漏れなく列挙できるか。","patterns":["部品の組み合わせを数える","数字の対応関係を絞り込む","硬貨の枚数と金額の条件を同時に満たす"],"q":"100円玉と50円玉を合わせて5枚使い、合計400円にします。100円玉と50円玉はそれぞれ何枚ですか。","a":"100円玉3枚、50円玉2枚","steps":["全部50円玉なら5×50＝250円","実際との差は400−250＝150円","50円玉を100円玉に替えると1枚につき50円増える","150÷50＝3枚を100円玉にする"],"pitfall":"金額だけでなく合計枚数も確認する。難しい問題では表を使い、候補を順番に消す。"},{"id":"solid","name":"複合立体の体積","years":"令和7・8年 大問2-(10)","asks":"立体を基本形に分けたり、大きな立体から欠けた部分を引いて体積を求められるか。","patterns":["直方体を組み合わせた体積","くり抜かれた部分の体積を差し引く"],"q":"縦8cm、横6cm、高さ5cmの直方体から、縦2cm、横3cm、高さ5cmの直方体を切り取りました。残りの体積は何cm³ですか。","a":"210cm³","steps":["全体の体積は8×6×5＝240cm³","切り取った部分は2×3×5＝30cm³","240−30＝210cm³"],"pitfall":"長さの単位と体積の単位を区別し、重なりや欠けを図で確認する。"}];
const id=new URLSearchParams(location.search).get('id')||'inverse';const t=THEMES.find(x=>x.id===id)||THEMES[0];
const $=x=>document.getElementById(x);$('title').textContent=t.name;$('years').textContent='過去問での該当箇所：'+t.years;$('asks').textContent=t.asks;$('question').textContent=t.q;$('result').textContent='答え：'+t.a;$('pitfall').textContent=t.pitfall;document.title=t.name+'｜鎌倉国際文理中学校 算数';
for(const x of t.patterns){const li=document.createElement('li');li.textContent=x;$('patterns').appendChild(li)}
for(const x of t.steps){const li=document.createElement('li');li.textContent=x;$('steps').appendChild(li)}
for(const x of THEMES){const a=document.createElement('a');a.href='theme.html?id='+encodeURIComponent(x.id);a.textContent=x.name;if(x.id===t.id)a.className='current';$('nav').appendChild(a)}
$('show').onclick=()=>{const open=$('answer').hidden;$('answer').hidden=!open;$('show').textContent=open?'答え・考え方を閉じる':'答え・考え方を見る';$('show').setAttribute('aria-expanded',String(open))};
</script></body></html>
